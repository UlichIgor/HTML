<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Приклад 2 — текст, посилання та зображення</title>
</head>
<body>
  <main>
    <h1>Текстові елементи HTML</h1>
    <h2>Заголовок другого рівня</h2>
    <p>HTML дозволяє створювати <strong>важливий текст</strong> та <em>логічний наголос</em>.</p>
    <p>Фрагмент коду: <code>console.log("Привіт!");</code></p>

    <h2>Посилання</h2>
    <p>
      Читайте документацію на
      <a href="https://developer.mozilla.org/uk/docs/Web/HTML">MDN українською</a>.
    </p>

    <h2>Зображення</h2>
    <figure>
      <img src="../assets/html5.png" alt="Логотип HTML5" width="240" height="240">
      <figcaption>Зображення з альтернативним текстом і підписом.</figcaption>
    </figure>
  </main>
</body>
</html>
