<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Приклад 4 — HTML-форми</title>
</head>
<body>
  <main>
    <h1>Реєстраційна форма — навчальний приклад</h1>
    <p>Дані цієї демонстраційної форми не надсилаються на сервер.</p>

    <form action="#" method="get">
      <fieldset>
        <legend>Особисті дані</legend>

        <p>
          <label for="full-name">Ім'я:</label>
          <input id="full-name" name="fullName" type="text" autocomplete="name" required minlength="2">
        </p>

        <p>
          <label for="email">Електронна пошта:</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </p>

        <p>
          <label for="age">Вік:</label>
          <input id="age" name="age" type="number" min="14" max="120">
        </p>
      </fieldset>

      <fieldset>
        <legend>Налаштування</legend>

        <p>
          <input id="news" name="newsletter" type="checkbox" value="yes">
          <label for="news">Отримувати навчальні новини</label>
        </p>

        <p>Рівень знань:</p>
        <p>
          <input id="beginner" name="level" type="radio" value="beginner" checked>
          <label for="beginner">Початківець</label>
        </p>
        <p>
          <input id="advanced" name="level" type="radio" value="advanced">
          <label for="advanced">Маю досвід</label>
        </p>

        <p>
          <label for="topic">Цікава тема:</label>
          <select id="topic" name="topic">
            <option value="structure">Структура HTML</option>
            <option value="forms">Форми</option>
            <option value="accessibility">Доступність</option>
          </select>
        </p>

        <p>
          <label for="comment">Коментар:</label>
          <textarea id="comment" name="comment" rows="4"></textarea>
        </p>
      </fieldset>

      <button type="submit">Надіслати форму</button>
      <button type="reset">Очистити поля</button>
    </form>
  </main>
</body>
</html>
